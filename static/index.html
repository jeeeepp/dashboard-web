<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8a90a0;
    --accent: #4f8cff;
    --good: #34c77b;
    --bad: #ef5b5b;
    --warn: #e8b339;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    margin-right: auto;
  }
  #status-line {
    font-size: 13px;
    color: var(--muted);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .conditions {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .cond-group {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
    min-width: 260px;
  }
  .cond-group > .group-title {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .cond-group label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .cond-group input, .cond-group select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .cond-group input[type="text"].periods { width: 140px; }
  .cond-group input[type="number"] { width: 80px; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .filters label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .filters input, .filters select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .filters .checkbox-field {
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }
  .hint {
    display: inline-block;
    cursor: help;
    color: var(--muted);
    border-bottom: 1px dotted var(--muted);
  }
  main { padding: 0 20px 40px; }
  .table-wrap {
    overflow-x: auto;
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    min-width: 900px;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    position: sticky;
    top: 0;
    background: var(--panel);
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-weight: 600;
  }
  th.sorted { color: var(--text); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  .tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 4px;
  }
  .tag-good { background: rgba(52,199,123,0.15); color: var(--good); }
  .tag-bad { background: rgba(239,91,91,0.15); color: var(--bad); }
  .tag-warn { background: rgba(232,179,57,0.15); color: var(--warn); }
  .tag-muted { background: rgba(138,144,160,0.15); color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #empty-state { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📊 Scan Dashboard</h1>
  <span id="status-line">กำลังโหลด...</span>
  <button id="refresh-btn">Refresh now</button>
</header>

<div class="conditions">
  <div class="cond-group">
    <div class="group-title"><input id="rsi-enabled" type="checkbox"> <span class="hint" title="เปิดใช้เงื่อนไข RSI: คำนวณ RSI จาก close price ตาม period ที่ตั้ง แล้วเทียบกับค่า Value ด้วย operator ที่เลือก (เช่น RSI(50) > 60) ต้องผ่านเงื่อนไขนี้ด้วยถ้าเปิดใช้ (AND กับ SMA/EMA)">RSI ⓘ</span></div>
    <label>Period
      <input id="rsi-period" type="number" min="2" max="200" value="50">
    </label>
    <label>Operator
      <select id="rsi-operator">
        <option value=">">&gt;</option>
        <option value="<">&lt;</option>
        <option value="=">=</option>
      </select>
    </label>
    <label>Value
      <input id="rsi-value" type="number" step="1" value="60">
    </label>
  </div>

  <div class="cond-group">
    <div class="group-title"><input id="sma-enabled" type="checkbox"> <span class="hint" title="เปิดใช้เงื่อนไข SMA: เทียบราคาปิดล่าสุดกับ SMA ของทุก period ที่ใส่ไว้ (คั่นด้วยจุลภาค) ด้วย operator เดียวกันทั้งหมด — ต้องผ่านทุก period (AND) เช่น price > SMA(5) และ price > SMA(20) และ ... แก้ตัวเลข period ได้เอง">SMA (price vs. every period below) ⓘ</span></div>
    <label>Operator
      <select id="sma-operator">
        <option value=">">price &gt; SMA</option>
        <option value="<">price &lt; SMA</option>
        <option value="=">price = SMA</option>
      </select>
    </label>
    <label>Periods (comma-separated)
      <input id="sma-periods" class="periods" type="text" value="5,20,150,200">
    </label>
  </div>

  <div class="cond-group">
    <div class="group-title"><input id="ema-enabled" type="checkbox"> EMA (price vs. every period below)</div>
    <label>Operator
      <select id="ema-operator">
        <option value=">">price &gt; EMA</option>
        <option value="<">price &lt; EMA</option>
        <option value="=">price = EMA</option>
      </select>
    </label>
    <label>Periods (comma-separated)
      <input id="ema-periods" class="periods" type="text" value="7,30,89,200">
    </label>
  </div>
</div>

<div class="filters">
  <label>Market
    <select id="f-market">
      <option value="all">ทั้งหมด</option>
      <option value="SET">SET</option>
      <option value="US">US</option>
    </select>
  </label>
  <label class="checkbox-field"><input id="f-squeeze" type="checkbox"> <span class="hint" title="กรองเฉพาะหุ้นที่ราคากำลัง &quot;บีบตัว&quot; (Bollinger Band bandwidth แคบสุดในรอบ ~10% ล่างของ 125 วันทำการที่ผ่านมา) — เป็นสัญญาณเรื่อง &quot;เวลา&quot; ว่าน่าจะมีการเคลื่อนไหวแรงเร็วๆ นี้ ไม่ได้บอกทิศทางว่าจะขึ้นหรือลง">Squeeze only ⓘ</span></label>
  <label class="checkbox-field"><input id="f-owned" type="checkbox"> <span class="hint" title="กรองเฉพาะหุ้นที่อยู่ใน watchlist.txt ของคุณเอง (หุ้นที่ถืออยู่/ติดตามอยู่จริง) — ไม่เกี่ยวกับผลสแกน แค่ติด tag ว่าตัวไหนเป็นของคุณ">Owned only ⓘ</span></label>
  <label>ค้นหา ticker
    <input id="f-q" type="text" placeholder="เช่น PTT">
  </label>
</div>

<main>
  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th data-key="ticker">Ticker</th>
          <th data-key="market">Market</th>
          <th data-key="price">Price</th>
          <th data-key="rsi">RSI</th>
          <th>SMA</th>
          <th>EMA</th>
          <th data-key="squeeze">Squeeze</th>
          <th data-key="owned">Owned</th>
          <th data-key="as_of_date">As of</th>
          <th>Chart</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="empty-state" style="display:none;">ไม่มีข้อมูลตรงกับเงื่อนไขนี้</div>
</main>

<script>
const statusLine = document.getElementById('status-line');
const refreshBtn = document.getElementById('refresh-btn');
const tbody = document.getElementById('tbody');
const emptyState = document.getElementById('empty-state');

let sortKey = 'ticker';
let sortDir = 1;
let lastRows = [];
let debounceTimer = null;
let pollTimer = null;

function parsePeriods(text) {
  return text.split(',')
    .map(s => parseInt(s.trim(), 10))
    .filter(n => Number.isInteger(n) && n >= 2 && n <= 400);
}

function buildRequestBody() {
  return {
    rsi: {
      enabled: document.getElementById('rsi-enabled').checked,
      period: parseInt(document.getElementById('rsi-period').value, 10) || 50,
      operator: document.getElementById('rsi-operator').value,
      threshold: parseFloat(document.getElementById('rsi-value').value) || 0,
    },
    sma: {
      enabled: document.getElementById('sma-enabled').checked,
      operator: document.getElementById('sma-operator').value,
      periods: parsePeriods(document.getElementById('sma-periods').value),
    },
    ema: {
      enabled: document.getElementById('ema-enabled').checked,
      operator: document.getElementById('ema-operator').value,
      periods: parsePeriods(document.getElementById('ema-periods').value),
    },
    market: document.getElementById('f-market').value,
    owned_only: document.getElementById('f-owned').checked,
    squeeze_only: document.getElementById('f-squeeze').checked,
    q: document.getElementById('f-q').value.trim(),
  };
}

function fmt(v, digits) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') return v.toFixed(digits ?? 2);
  return v;
}

function tag(text, cls) {
  return `<span class="tag ${cls}">${text}</span>`;
}

function fmtMaGroup(values) {
  // values: {period: computedValue}
  const keys = Object.keys(values || {});
  if (keys.length === 0) return '—';
  return keys.map(p => `${p}:${Number(values[p]).toFixed(2)}`).join(' ');
}

function renderRows(rows) {
  lastRows = rows;
  const sorted = [...rows].sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) return 1;
    if (bv === null || bv === undefined) return -1;
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  if (sorted.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  tbody.innerHTML = sorted.map(r => {
    const squeezeTag = r.squeeze ? tag('บีบตัว', 'tag-warn') : '';
    const ownedTag = r.owned ? tag('Owned', 'tag-good') : '';
    return `<tr>
      <td><strong>${r.ticker}</strong></td>
      <td>${r.market}</td>
      <td>${fmt(r.price, 2)}</td>
      <td>${fmt(r.rsi, 1)}</td>
      <td>${fmtMaGroup(r.sma)}</td>
      <td>${fmtMaGroup(r.ema)}</td>
      <td>${squeezeTag}</td>
      <td>${ownedTag}</td>
      <td>${r.as_of_date ?? '—'}</td>
      <td><a href="https://finance.yahoo.com/chart/${encodeURIComponent(r.ticker)}" target="_blank" rel="noopener">chart</a></td>
    </tr>`;
  }).join('');
}

function relativeTime(iso) {
  if (!iso) return 'ไม่มีข้อมูล';
  const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diffSec < 60) return `${diffSec} วินาทีที่แล้ว`;
  if (diffSec < 3600) return `${Math.floor(diffSec / 60)} นาทีที่แล้ว`;
  return `${Math.floor(diffSec / 3600)} ชั่วโมงที่แล้ว`;
}

async function loadScan() {
  // Returns a plain result object instead of touching statusLine directly --
  // tick() below is the single place that decides the final status message,
  // combining this with pollStatus()'s result. Two functions independently
  // writing statusLine caused one to silently clobber the other's message
  // every 5s poll.
  const resp = await fetch('/api/scan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildRequestBody()),
  });
  if (!resp.ok) {
    return { ok: false, httpStatus: resp.status };
  }
  const data = await resp.json();
  renderRows(data.rows);
  return { ok: true, count: data.count, total: data.total, stats: data.stats || {} };
}

async function pollStatus() {
  const resp = await fetch('/api/status');
  if (!resp.ok) return null;
  const data = await resp.json();
  if (data.scanning) {
    refreshBtn.disabled = true;
    const mins = Math.floor((data.scanning_elapsed_sec || 0) / 60);
    const secs = Math.floor((data.scanning_elapsed_sec || 0) % 60);
    refreshBtn.textContent = `กำลังสแกน... (${mins}:${String(secs).padStart(2, '0')})`;
  } else if (data.cooldown_remaining_sec) {
    refreshBtn.disabled = true;
    refreshBtn.textContent = `รออีก ${Math.ceil(data.cooldown_remaining_sec)}s`;
  } else {
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Refresh now';
  }
  return data;
}

async function tick() {
  const statusData = await pollStatus();
  const scanData = await loadScan();

  if (!scanData.ok) {
    statusLine.textContent = `โหลดข้อมูลไม่สำเร็จ (HTTP ${scanData.httpStatus})`;
    return;
  }

  const asOf = scanData.stats.generated_utc ? relativeTime(scanData.stats.generated_utc) : 'ไม่มีข้อมูล';
  let line = `${scanData.count}/${scanData.total} ตัว • อัปเดตล่าสุด ${asOf}`;

  if (statusData && statusData.scanning && statusData.scan_timeout_sec
      && statusData.scanning_elapsed_sec > statusData.scan_timeout_sec * 0.7) {
    // Getting close to the server's own timeout -- reassure the user this
    // isn't stuck forever, a timeout will free it up automatically.
    const mins = Math.floor(statusData.scanning_elapsed_sec / 60);
    const timeoutMins = Math.round(statusData.scan_timeout_sec / 60);
    line = `กำลังสแกนนานผิดปกติ (${mins} นาที) — ถ้าเกิน ${timeoutMins} นาทีระบบจะปล่อยให้ลองใหม่อัตโนมัติ • ${line}`;
  } else if (statusData && !statusData.scanning && statusData.stats && statusData.stats.last_error) {
    line = `⚠️ ครั้งล่าสุด error: ${statusData.stats.last_error} • ${line}`;
  }

  statusLine.textContent = line;
}

refreshBtn.addEventListener('click', async () => {
  const resp = await fetch('/api/refresh', { method: 'POST' });
  const data = await resp.json();
  if (data.status === 'started') {
    statusLine.textContent = 'กำลังสแกนใหม่...';
  } else if (data.status === 'already_running') {
    statusLine.textContent = 'มีการสแกนอยู่แล้ว กำลังรอผล...';
  } else if (data.status === 'cooldown') {
    statusLine.textContent = `กรุณารออีก ${Math.ceil(data.retry_after_sec)} วินาที`;
  }
  await pollStatus();
});

const allFieldIds = [
  'rsi-enabled', 'rsi-period', 'rsi-operator', 'rsi-value',
  'sma-enabled', 'sma-operator', 'sma-periods',
  'ema-enabled', 'ema-operator', 'ema-periods',
  'f-market', 'f-squeeze', 'f-owned', 'f-q',
];
allFieldIds.forEach(id => {
  const el = document.getElementById(id);
  const evt = (el.type === 'checkbox' || el.tagName === 'SELECT') ? 'change' : 'input';
  el.addEventListener(evt, () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadScan, 300);
  });
});

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      sortDir = -1;
    }
    document.querySelectorAll('th').forEach(h => h.classList.remove('sorted'));
    th.classList.add('sorted');
    renderRows(lastRows);
  });
});

tick();
pollTimer = setInterval(tick, 5000);
</script>
</body>
</html>
